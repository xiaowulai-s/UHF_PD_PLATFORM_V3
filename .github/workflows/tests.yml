name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # 内核要求 Python >= 3.10（见 pyproject.toml 的 requires-python）。
        # 3.9 不在支持范围内——曾在本文件里列过，但 core/ 的语法与依赖都不满足。
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 依赖一律从 pyproject.toml 装，不在 CI 里另抄一份清单——
    # 原先硬编码的 pip 清单漏了 PySide6/numpy/scipy/msgpack/websockets，测试根本起不来。
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      shell: bash
      run: |
        python -m pytest --cov=core --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
