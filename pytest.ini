# Pytest 配置

[pytest]
# 测试路径
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加选项
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=60
    --durations=10

# 覆盖率口径的**唯一来源**是 .coveragerc（source/omit/exclude_lines）+ 这里的
# --cov-fail-under。别再往 pyproject.toml 的 [tool.coverage.*] 里写第二份——
# coverage.py 只读它找到的第一个配置（.coveragerc 优先），写在那里是死的，
# 曾经就因此出现"文档写 80%、实际生效 10%"的矛盾。
#
# 门禁值 60 的含义：实测 66.5%~69.2%（两次跑差 2.7pp，非确定性见路线图 P2-5），
# 取 60 既真的会拦住回退，又不会被这个抖动误伤。路线图 P1-7 / P2-1 补完测试后
# 按 60 → 70 → 75 逐档抬高。
#
# 刻意不带 --cov=tests：把测试代码自身算进覆盖率是噪声，只会稀释信号。

# 标记定义
markers =
    slow: 慢速测试（需要较长时间运行）
    integration: 集成测试（需要真实环境）
    unit: 单元测试（独立测试）

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 日志配置
log_cli = false
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
