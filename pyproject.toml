# UHF-AE PD Detection System
# Python 3.10+ | 处理内核（core/）+ 无头 sidecar（sidecar.py）
#
# 注意：version 必须与 core/version.py 的 __version__ 和
# desktop/package.json 的 version 保持一致，否则装机包文件名与界面页脚会显示
# 两个不同的版本号。

[project]
name = "uhf-ae-pd-detector"
version = "0.0.1"
description = "超高频超声波局部放电检测系统 - UHF/AE dual-modality PD detection platform"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # 内核基于 Qt 的 signal/slot 做跨线程通信（core/foundation、core/protocol）
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
    # 信号处理
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # 跨进程协议：msgpack 帧编码 + 本机 WebSocket 传输
    "msgpack>=1.0.0",
    "websockets>=12.0",
    # 持久化与日志
    "sqlalchemy>=2.0.0",
    "structlog>=23.0.0",
    # 采集驱动
    "pyserial>=3.5",
    # 报告导出（Excel / Word）
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "toml>=0.10.2",
]

# ───────────────────────────────────────────────────────────
# Black 代码格式化（行宽与 .pre-commit-config.yaml 的钩子参数对齐）
# ───────────────────────────────────────────────────────────

[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
    /(
        \.eggs
        | \.git
        | \.hg
        | \.mypy_cache
        | \.tox
        | \.venv
        | _archive
        | _build
        | buck-out
        | build
        | dist
        | venv
        | __pycache__
    )/
'''

# ───────────────────────────────────────────────────────────
# pytest 测试框架
# ───────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "protocol: Protocol layer tests",
    "driver: Driver layer tests",
    "device: Device layer tests",
    "alarm: Alarm tests",
]
qt_api = "pyside6"

# 覆盖率配置**不在这里**。
#
# 仓库根有 `.coveragerc`，而 coverage.py 只读它找到的第一个配置（`.coveragerc` →
# `setup.cfg` → `pyproject.toml`），所以本节若存在就是死配置——写在这里的
# `fail_under = 80` 从来没生效过，实际门禁是 pytest.ini 的 `--cov-fail-under`。
# 曾因此出现"文档说 80%、实际 10%"的矛盾（见 docs/AUDIT_AND_ROADMAP.md §5-⑬）。
# 改覆盖率口径请改 `.coveragerc`（source/omit/exclude_lines）与 `pytest.ini`（门禁值）。

# ───────────────────────────────────────────────────────────
# mypy 类型检查
# ───────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["serial.*", "pyfftw.*", "h5py.*"]
ignore_missing_imports = true
