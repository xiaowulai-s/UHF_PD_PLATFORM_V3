repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # 必须合成一个 --extend-ignore **并加引号**：flake8 的 --ignore 重复出现时只有
        # 最后一个生效，原来这行写了四个 --ignore，实际只忽略了 C901，E203/E402/E501
        # 全都在跑，还把 .flake8 里的 ignore 表整个覆盖掉。E203 尤其没救——black 就是
        # 要在切片冒号前加空格，删了下次又被 black 加回来，永远对不齐。
        # 引号不能省：YAML 流式序列里逗号是元素分隔符，不加引号会被拆成
        # "--extend-ignore=E203" "E402" "E501" "C901"，后三个变成待检查的文件名，
        # 报 E902 FileNotFoundError。
        args: [--max-line-length=120, "--extend-ignore=E203,E402,E501,C901"]
        additional_dependencies: [flake8]
