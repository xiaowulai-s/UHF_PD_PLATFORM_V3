<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UHF-PD 局部放电检测系统</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Project shell overrides */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family-default); color: var(--text-default); background: var(--bg-base-secondary); }
    a { color: inherit; text-decoration: none; }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-base-secondary);
    }

    /* ===== Sidebar ===== */
    .app-sidebar {
      width: var(--pd-sidebar-width, 240px);
      min-width: var(--pd-sidebar-width, 240px);
      height: 100vh;
      background: var(--bg-white);
      border-right: var(--border-width-default) solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--spacer-3);
      padding: var(--spacer-5) var(--spacer-4);
      border-bottom: var(--border-width-default) solid var(--color-border);
      min-height: 64px;
    }
    .sidebar-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-8);
      background: var(--bg-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-brand-icon svg { width: 18px; height: 18px; fill: white; }
    .sidebar-brand-name {
      font-size: var(--heading-sm-font-size);
      font-weight: var(--font-weight-strong);
      color: var(--text-default);
      white-space: nowrap;
    }

    .sidebar-nav {
      flex: 1;
      padding: var(--spacer-3) 0;
      overflow-y: auto;
    }
    .sidebar-nav-section-label {
      font-size: var(--body-xs-font-size);
      font-weight: var(--font-weight-strong);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: var(--spacer-3) var(--spacer-4) var(--spacer-1);
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: var(--spacer-3);
      padding: var(--spacer-2) var(--spacer-4);
      font-size: var(--body-base-font-size);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      position: relative;
      font-family: var(--font-family-default);
    }
    .sidebar-nav-item:hover {
      background: var(--bg-overlay-l1);
      color: var(--text-default);
    }
    .sidebar-nav-item[data-active="true"] {
      background: var(--brand-100, #E5EAFF);
      color: var(--bg-brand);
      font-weight: var(--font-weight-medium);
    }
    .sidebar-nav-item[data-active="true"]::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      border-radius: 0 2px 2px 0;
      background: var(--bg-brand);
    }
    .sidebar-nav-icon {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-nav-icon svg { width: 16px; height: 16px; fill: currentColor; }
    .sidebar-nav-badge { margin-left: auto; flex-shrink: 0; }

    /* ===== Main ===== */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .app-topbar {
      height: var(--pd-topbar-height, 52px);
      min-height: var(--pd-topbar-height, 52px);
      background: var(--bg-white);
      border-bottom: var(--border-width-default) solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 var(--spacer-6);
      gap: var(--spacer-4);
      flex-shrink: 0;
    }
    .topbar-breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--spacer-2);
      font-size: var(--body-sm-font-size);
      color: var(--text-tertiary);
    }
    .topbar-breadcrumb-current {
      font-weight: var(--font-weight-medium);
      color: var(--text-default);
    }
    .topbar-divider {
      width: 1px;
      height: 20px;
      background: var(--color-border);
    }
    .topbar-search {
      flex: 1;
      max-width: 360px;
      margin-left: auto;
      position: relative;
    }
    .topbar-search input {
      width: 100%;
      padding: var(--spacer-2) var(--spacer-3) var(--spacer-2) var(--spacer-8);
      font-size: var(--body-sm-font-size);
      border: var(--border-width-default) solid var(--color-border);
      border-radius: var(--radius-6);
      background: var(--bg-base-secondary);
      outline: none;
      font-family: var(--font-family-default);
      color: var(--text-default);
      transition: border-color 120ms ease;
    }
    .topbar-search input:focus { border-color: var(--bg-brand); }
    .topbar-search-icon {
      position: absolute;
      left: var(--spacer-3);
      top: 50%;
      transform: translateY(-50%);
      width: var(--icon-size-14);
      height: var(--icon-size-14);
      fill: var(--text-tertiary);
      pointer-events: none;
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacer-6);
      display: flex;
      flex-direction: column;
      gap: var(--spacer-5);
    }

    .app-statusbar {
      height: var(--pd-statusbar-height, 32px);
      min-height: var(--pd-statusbar-height, 32px);
      background: var(--bg-white);
      border-top: var(--border-width-default) solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 var(--spacer-6);
      gap: var(--spacer-6);
      font-size: var(--body-xs-font-size);
      color: var(--text-tertiary);
      flex-shrink: 0;
    }
    .statusbar-item {
      display: flex;
      align-items: center;
      gap: var(--spacer-2);
    }
    .statusbar-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--radius-full);
    }
    .statusbar-dot-online { background: var(--status-success-default); }
    .statusbar-dot-offline { background: var(--status-error-default); }
    .statusbar-sep {
      width: 1px;
      height: 14px;
      background: var(--color-border);
    }

    /* ===== Responsive ===== */
    @media (max-width: 1280px) {
      .app-sidebar { width: var(--pd-sidebar-collapsed, 64px); min-width: var(--pd-sidebar-collapsed, 64px); }
      .sidebar-brand-name,
      .sidebar-nav-section-label,
      .sidebar-nav-item span:not(.sidebar-nav-icon) { display: none; }
      .sidebar-nav-item { justify-content: center; padding: var(--spacer-3); }
      .sidebar-nav-item[data-active="true"]::before { display: none; }
    }
    @media (max-width: 768px) {
      .app-sidebar { display: none; }
      .app-statusbar { display: none; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ===== Main Content Area ===== -->

      <!-- SLOT: pageBody — each page fills this slot -->
    </main>

      </div>

</div>

<script>
  // Navigation helper
  function navigateTo(pageId) {
    const pages = {
      'page-dashboard': 'pages/dashboard.html',
      'page-monitor': 'pages/monitor.html',
      'page-analysis': 'pages/analysis.html',
      'page-trend': 'pages/trend.html',
      'page-alarm': 'pages/alarm.html',
      'page-device': 'pages/device.html',
      'page-ae': 'pages/ae.html',
      'page-log': 'pages/log.html',
      'page-settings': 'pages/settings.html'
    };
    const target = pages[pageId];
    if (target) {
      window.location.href = target;
    }
  }

  // Set active nav item from data-active attribute
  document.querySelectorAll('.sidebar-nav-item[data-active="true"]').forEach(function(el) {
    // Already marked by slot
  });
</script>
</body>
</html>
